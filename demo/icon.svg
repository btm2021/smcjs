<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="candleBull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="candleBear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="atrVidya" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.25"/>
  
  <!-- Grid lines -->
  <line x1="64" y1="160" x2="448" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="64" y1="352" x2="448" y2="352" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Candlesticks -->
  <!-- Candle 1: Bull -->
  <line x1="140" y1="200" x2="140" y2="380" stroke="#10b981" stroke-width="4"/>
  <rect x="120" y="240" width="40" height="100" rx="6" fill="url(#candleBull)"/>

  <!-- Candle 2: Bear -->
  <line x1="220" y1="160" x2="220" y2="340" stroke="#f43f5e" stroke-width="4"/>
  <rect x="200" y="190" width="40" height="110" rx="6" fill="url(#candleBear)"/>

  <!-- Candle 3: Big Bull -->
  <line x1="300" y1="120" x2="300" y2="320" stroke="#10b981" stroke-width="4"/>
  <rect x="280" y="150" width="40" height="130" rx="6" fill="url(#candleBull)"/>

  <!-- Candle 4: Bull -->
  <line x1="380" y1="80" x2="380" y2="260" stroke="#10b981" stroke-width="4"/>
  <rect x="360" y="110" width="40" height="110" rx="6" fill="url(#candleBull)"/>

  <!-- Trend VIDYA / ATR line -->
  <path d="M 80 340 Q 180 300, 260 220 T 440 100" fill="none" stroke="url(#atrVidya)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Text SMC -->
  <text x="256" y="440" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="4">SMC.JS</text>
</svg>
